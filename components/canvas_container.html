  <!-- ==================== 3. MAIN INTERACTIVE 3D & 2D CANVAS CONTAINER (Refined Old Design) ==================== -->
  <main class="flex-1 relative overflow-hidden bg-[#e6e1da]">
    <!-- Three.js Canvas Container -->
    <div id="canvas-container" class="w-full h-full cursor-grab active:cursor-grabbing"></div>

    <!-- FLOATING BOTTOM TOOLBAR (Exact Old Design Pills with Refined Glassmorphism) -->
    <div class="absolute bottom-6 left-6 right-24 z-20 pointer-events-none flex justify-between items-center">
      <div class="flex items-center space-x-2 pointer-events-auto">
        <div class="glass-card rounded-full shadow-lg px-4 py-2 flex items-center space-x-3 text-xs font-bold text-gray-700 border border-white/80">
          <label class="flex items-center space-x-1.5 cursor-pointer text-gray-800 font-bold hover:text-black transition" title="Toggle Clean 3D View (Hides UI controls for full 3D viewing)">
            <input type="checkbox" id="toggle-immersive-view" onchange="toggleImmersiveView(this.checked)" class="rounded accent-amber-600 cursor-pointer">
            <span>3D View</span>
          </label>
          <span class="text-gray-300">|</span>
          <label class="flex items-center space-x-1.5 cursor-pointer hover:text-black transition">
            <input type="checkbox" id="toggle-grid" onchange="toggleGridVisibility(this.checked)" class="rounded accent-amber-600 cursor-pointer">
            <span>Grid Snap</span>
          </label>
          <span class="text-gray-300">|</span>
          <label class="flex items-center space-x-1.5 cursor-pointer hover:text-black transition">
            <input type="checkbox" id="toggle-wall-snap" checked class="rounded accent-amber-600 cursor-pointer">
            <span>Wall Snap</span>
          </label>
          <span class="text-gray-300">|</span>
          <label class="flex items-center space-x-1.5 cursor-pointer hover:text-emerald-700 transition">
            <input type="checkbox" id="toggle-clearance-chk" checked onchange="toggleClearanceZones(this.checked)" class="rounded accent-emerald-600 cursor-pointer">
            <span>Clearance Zones</span>
          </label>
        </div>
      </div>

      <!-- Right: Room Size, Luxury Surfaces & Clear Room (Right-Aligned) -->
      <div id="bottom-right-tools" class="flex items-center space-x-3 pointer-events-auto">
        <button onclick="openDimensionsModal()" class="glass-card text-gray-900 px-5 py-2.5 rounded-full font-extrabold text-xs shadow-md hover:shadow-lg flex items-center space-x-2 hover:bg-white transition border border-white/90 transform hover:-translate-y-0.5 cursor-pointer">
          <i class="fa-solid fa-ruler-combined text-sm text-amber-600"></i>
          <span>Room Size (<span id="btn-size-preview">10.5×9.2 ft</span>)</span>
        </button>

        <button onclick="openFinishesModal()" class="glass-card hover:bg-white text-gray-900 px-5 py-2.5 rounded-full font-extrabold text-xs shadow-md hover:shadow-lg flex items-center space-x-2 transition border border-white/90 transform hover:-translate-y-0.5 cursor-pointer">
          <i class="fa-solid fa-paint-roller text-xs text-amber-600"></i>
          <span>Luxury Surfaces</span>
        </button>

        <button onclick="confirmClearRoom()" class="glass-card text-rose-600 hover:text-white hover:bg-rose-600 px-4 py-2.5 rounded-full shadow-md text-xs font-bold transition flex items-center space-x-2 border border-rose-200/90 hover:border-rose-600 transform hover:scale-105 active:scale-95 group cursor-pointer">
          <i class="fa-solid fa-trash-can group-hover:animate-bounce"></i>
          <span>Clear Room</span>
        </button>
      </div>
    </div>

    <!-- FLOATING ITEM INSPECTOR CARD -->
    <div id="inspector-card" class="absolute bottom-20 left-6 w-84 glass-card shadow-2xl rounded-3xl p-5 hidden border border-white/90 z-30 pointer-events-auto transition-all duration-200">
      <div class="flex justify-between items-start mb-2">
        <div>
          <span class="text-[10px] uppercase font-bold tracking-wider text-amber-700" id="insp-series">KOHLER Collection</span>
          <h3 class="font-black text-base text-gray-900 leading-tight" id="insp-name">Veil Smart Toilet</h3>
          <span class="text-xs text-gray-500 font-mono" id="insp-art">K-5401IN-0</span>
        </div>
        <button onclick="deselectActiveObject()" class="text-gray-400 hover:text-black w-6 h-6 flex items-center justify-center rounded-full hover:bg-gray-100 transition cursor-pointer">
          <i class="fa-solid fa-xmark text-sm"></i>
        </button>
      </div>

      <!-- Finish Swatches for Selected Object -->
      <div id="insp-finishes-box" class="mt-3 hidden">
        <label class="block text-[10px] font-bold uppercase tracking-wider text-gray-400 mb-1.5">Kohler Finish / Trim</label>
        <div class="flex items-center space-x-2" id="insp-finish-swatches"></div>
      </div>

      <!-- Elevation Slider for Wall-Hung Items -->
      <div id="insp-elevation-box" class="mt-3 hidden">
        <div class="flex justify-between text-xs font-bold text-gray-700 mb-1">
          <span>Wall Mount Elevation:</span>
          <span id="insp-elevation-label" class="font-mono text-amber-700">1.65 m</span>
        </div>
        <input type="range" id="insp-elevation-slider" min="0.2" max="2.2" step="0.05" oninput="adjustSelectedElevation(this.value)" class="w-full accent-black cursor-pointer">
      </div>

      <!-- Object Transform Buttons -->
      <div class="mt-4 pt-3 border-t border-gray-200/80 flex items-center space-x-2">
        <button onclick="rotateActiveObject(Math.PI / 2)" class="flex-1 bg-gray-100 hover:bg-gray-200 py-2 rounded-xl text-xs font-bold text-gray-800 transition flex items-center justify-center space-x-1.5 cursor-pointer">
          <i class="fa-solid fa-rotate-right text-xs"></i>
          <span>Rotate 90°</span>
        </button>
        <button onclick="duplicateActiveObject()" class="flex-1 bg-gray-100 hover:bg-gray-200 py-2 rounded-xl text-xs font-bold text-gray-800 transition flex items-center justify-center space-x-1.5 cursor-pointer">
          <i class="fa-regular fa-clone text-xs"></i>
          <span>Duplicate</span>
        </button>
      </div>

      <div class="mt-2">
        <button onclick="deleteActiveObject()" class="w-full bg-red-50 text-red-600 hover:bg-red-100 py-2 rounded-xl text-xs font-bold transition flex items-center justify-center space-x-1.5 border border-red-200 cursor-pointer">
          <i class="fa-solid fa-trash-can"></i>
          <span>Remove from Bathroom</span>
        </button>
      </div>
    </div>
