  <!-- ==================== 7. LUXURY FINISHES CUSTOMIZER MODAL ==================== -->
  <div id="modal-finishes" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl shadow-2xl max-w-xl w-full p-6 space-y-5 border border-gray-100">
      <div class="flex justify-between items-center border-b border-gray-100 pb-3">
        <h3 class="font-black text-lg text-gray-900 flex items-center space-x-2">
          <i class="fa-solid fa-paint-roller text-amber-600"></i>
          <span>Luxury Surfaces & Finishes</span>
        </h3>
        <button onclick="closeFinishesModal()" class="text-gray-400 hover:text-black w-8 h-8 rounded-full hover:bg-gray-100 flex items-center justify-center transition">
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>
      </div>

      <!-- Wall Finishes -->
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Wall Surfaces</label>
        <div class="grid grid-cols-3 gap-2.5 text-xs">
          <button onclick="setWallFinish('square')" class="border-2 border-black rounded-xl p-2.5 text-left font-bold flex flex-col space-y-1 hover:bg-gray-50 transition">
            <span class="w-full h-8 rounded bg-gray-200 border border-gray-300"></span>
            <span class="text-gray-900">White Ceramic Grid</span>
          </button>
          <button onclick="setWallFinish('calacatta')" class="border border-gray-200 rounded-xl p-2.5 text-left font-bold flex flex-col space-y-1 hover:bg-gray-50 transition">
            <span class="w-full h-8 rounded bg-[#faf9f5] border border-amber-200"></span>
            <span class="text-gray-900">Calacatta Gold</span>
          </button>
          <button onclick="setWallFinish('marquina')" class="border border-gray-200 rounded-xl p-2.5 text-left font-bold flex flex-col space-y-1 hover:bg-gray-50 transition">
            <span class="w-full h-8 rounded bg-[#1e2227] border border-gray-600"></span>
            <span class="text-gray-900">Nero Marquina</span>
          </button>
        </div>
      </div>

      <!-- Floor Finishes -->
      <div>
        <label class="block text-xs font-bold text-gray-700 uppercase tracking-wider mb-2">Floor Surfaces</label>
        <div class="grid grid-cols-3 gap-2.5 text-xs">
          <button onclick="setFloorFinish('slate')" class="border-2 border-black rounded-xl p-2.5 text-left font-bold flex flex-col space-y-1 hover:bg-gray-50 transition">
            <span class="w-full h-8 rounded bg-[#383b3e] border border-gray-600"></span>
            <span class="text-gray-900">Charcoal Slate</span>
          </button>
          <button onclick="setFloorFinish('teak')" class="border border-gray-200 rounded-xl p-2.5 text-left font-bold flex flex-col space-y-1 hover:bg-gray-50 transition">
            <span class="w-full h-8 rounded bg-[#a67c52] border border-[#855f38]"></span>
            <span class="text-gray-900">Natural Teak Slat</span>
          </button>
          <button onclick="setFloorFinish('carrara')" class="border border-gray-200 rounded-xl p-2.5 text-left font-bold flex flex-col space-y-1 hover:bg-gray-50 transition">
            <span class="w-full h-8 rounded bg-[#f0f2f5] border border-gray-300"></span>
            <span class="text-gray-900">Carrara White</span>
          </button>
        </div>
      </div>

      <button onclick="closeFinishesModal()" class="w-full bg-black hover:bg-gray-900 text-white py-3 rounded-xl font-bold text-xs shadow-lg transition">
        Confirm Finishes
      </button>
    </div>
  </div>
