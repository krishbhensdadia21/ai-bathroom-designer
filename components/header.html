  <!-- ==================== 1. TOP KOHLER PLATFORM HEADER (Refined Old Design) ==================== -->
  <header id="main-header" class="h-16 bg-white/95 backdrop-blur-md border-b border-gray-200/80 z-40 px-6 flex items-center justify-between shadow-xs relative select-none">
    <!-- Left: Authentic 'THE BOLD LOOK OF KOHLER' Brand Lockup -->
    <div class="flex items-center space-x-4">
      <div class="flex items-center select-none cursor-pointer py-0.5 group" onclick="resetToInitialView()" title="THE BOLD LOOK OF KOHLER">
        <div class="flex flex-col leading-none">
          <span class="text-[10px] font-light text-neutral-800 uppercase group-hover:text-black transition" style="letter-spacing: 0.24em;">THE BOLD LOOK</span>
          <div class="flex items-baseline space-x-1.5 mt-0.5">
            <span class="text-[12px] font-light tracking-[0.14em] text-neutral-800 uppercase group-hover:text-black transition">OF</span>
            <span class="text-[20px] font-black tracking-[-0.03em] text-black uppercase leading-none">KOHLER</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Center: AI Assistant (Exact Old Design Centrally Aligned with Sleek Icon) -->
    <div class="hidden md:flex absolute left-1/2 -translate-x-1/2 items-center">
      <button onclick="openAiAssistantModal()" class="bg-gradient-to-r from-gray-950 via-black to-gray-950 text-white hover:from-neutral-900 hover:to-neutral-900 px-4 py-1.5 rounded-full font-bold text-xs shadow-md hover:shadow-lg flex items-center space-x-2 border border-amber-500/40 hover:border-amber-400 transition transform hover:-translate-y-0.5 group cursor-pointer">
        <span class="w-5 h-5 rounded-full bg-amber-500/20 flex items-center justify-center text-amber-400 text-[10px] group-hover:scale-110 transition">
          <i class="fa-solid fa-wand-magic-sparkles"></i>
        </span>
        <span class="tracking-wide">AI Assistant</span>
      </button>
    </div>

    <!-- Right: Currency, Investment Readout & Design Quote (Exact Old Design) -->
    <div class="flex items-center space-x-4">
      <!-- Currency Switcher -->
      <div class="flex items-center space-x-1 text-xs">
        <label for="currency-selector" class="text-[10px] uppercase font-bold text-gray-400">Curr:</label>
        <select id="currency-selector" onchange="changeCurrency(this.value)" class="bg-transparent font-bold text-black border border-gray-200 rounded px-1.5 py-0.5 outline-none cursor-pointer hover:border-black transition">
          <option value="INR">INR (₹)</option>
          <option value="USD">USD ($)</option>
          <option value="CAD">CAD ($)</option>
        </select>
      </div>

      <!-- Live Investment Readout -->
      <div class="flex flex-col text-right pl-3 border-l border-gray-200">
        <div class="flex items-center justify-end space-x-1">
          <span class="text-[9px] uppercase font-extrabold tracking-wider text-gray-400">Investment</span>
          <span id="planner-config-status" class="hidden"></span>
        </div>
        <div class="text-sm font-black text-gray-900 tracking-tight flex items-baseline space-x-0.5">
          <span id="currency-symbol-display">₹</span>
          <span id="header-total-price" class="text-sm font-extrabold text-black">0</span>
        </div>
      </div>

      <!-- Consolidated KOHLER Design & Quote Button -->
      <button onclick="openShoppingList()" id="btn-open-bom" class="bg-black hover:bg-gray-900 text-white px-4 py-1.5 rounded-full font-bold text-xs flex items-center space-x-2 shadow-md hover:shadow-lg transition transform hover:-translate-y-0.5 cursor-pointer" title="KOHLER Design & Quote (Includes BOM, Studio KOHLER Specs & KDX Concierge)">
        <i class="fa-solid fa-file-invoice text-amber-500 text-xs"></i>
        <span>KOHLER Design & Quote</span>
        <span id="badge-item-count" class="bg-amber-50 text-amber-800 border border-amber-200/80 w-4 h-4 rounded-full text-[10px] font-black flex items-center justify-center">0</span>
      </button>
    </div>
  </header>
